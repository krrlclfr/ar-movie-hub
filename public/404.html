<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <script>
      const path = window.location.pathname.replace(/^\/ar-movie-hub/, '') || '/';
      const redirect = '/ar-movie-hub/?p=' + encodeURIComponent(path);
      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
